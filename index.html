<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#F4F7FA}
  *{box-sizing:border-box}
  a{color:#087BB2;text-decoration:none}
  a:hover{color:#0B5C88}
  input,select,textarea,button{font-family:'Public Sans',system-ui,sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#D5E1EA;border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  @keyframes pulsedot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  @keyframes shimmer{0%{background-position:-320px 0}100%{background-position:320px 0}}
</style>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Public Sans',system-ui,sans-serif;color:#0E2A3B;background:#F4F7FA;font-size:13px">

  <aside style="{{ asideStyle }}">
    <div style="padding:16px 16px 12px;border-bottom:1px solid #EEF3F7;display:flex;align-items:center;gap:10px">
      <img src="assets/3rivers-logo.png" alt="3Rivers" style="{{ logoStyle }}">
      <span style="flex:1"></span>
      <div onClick="{{ toggleRail }}" title="Collapse menu" style="width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#7C93A5;font-size:12px" style-hover="background:#F0F5F9;color:#087BB2">☰</div>
    </div>
    <nav style="flex:1;overflow-y:auto;padding:8px 8px 24px">
      <sc-for list="{{ navRows }}" as="row" hint-placeholder-count="16">
        <sc-if value="{{ row.isGroup }}" hint-placeholder-val="{{ true }}">
          <div onClick="{{ row.onClick }}" style="{{ row.style }}">
            <span style="width:9px;font-size:8px;color:#9DB2C1">{{ row.arrow }}</span>
            <span style="flex:1;white-space:nowrap;overflow:hidden">{{ row.label }}</span>
            <sc-if value="{{ row.phase }}">
              <span style="font-family:'Barlow',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.06em;color:#7C93A5;border:1px solid #DFE8EF;border-radius:3px;padding:1px 4px">{{ row.phase }}</span>
            </sc-if>
          </div>
        </sc-if>
        <sc-if value="{{ row.isItem }}">
          <div onClick="{{ row.onClick }}" title="{{ row.label }}" style="{{ row.style }}">
            <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ row.label }}</span>
            <sc-if value="{{ row.badge }}">
              <span style="{{ row.badgeStyle }}">{{ row.badge }}</span>
            </sc-if>
          </div>
        </sc-if>
      </sc-for>
    </nav>
    <div style="border-top:1px solid #EEF3F7;padding:11px 16px;display:flex;align-items:center;gap:10px">
      <div style="width:29px;height:29px;flex:none;border-radius:50%;background:#E7F2F9;color:#087BB2;font-family:'Barlow',sans-serif;font-weight:700;font-size:11.5px;display:flex;align-items:center;justify-content:center">JT</div>
      <div style="{{ userMetaStyle }}">
        <div style="font-size:12.5px;font-weight:600">Joshua Tohey</div>
        <div style="font-size:11px;color:#7C93A5">Owner / Admin</div>
      </div>
    </div>
  </aside>

  <main style="flex:1;min-width:1010px;display:flex;flex-direction:column">
    <header style="position:sticky;top:0;z-index:30;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-bottom:1px solid #E2E9EF;padding:0 24px;height:58px;display:flex;align-items:center;gap:14px;flex:none">
      <div onClick="{{ openPalette }}" style="display:flex;align-items:center;gap:9px;width:100%;max-width:400px;font-size:13px;color:#9DB2C1;background:#F4F7FA;border:1px solid #E2E9EF;border-radius:8px;padding:8px 12px;cursor:pointer" style-hover="border-color:#087BB2;color:#5B7387">
        <span>⌕</span><span style="flex:1">Search leads, jobs, contacts, screens…</span>
        <span style="font-size:10.5px;font-weight:600;border:1px solid #DFE8EF;border-radius:4px;padding:1px 5px;background:#fff">⌘K</span>
      </div>
      <span style="flex:1"></span>
      <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:#5B7387;background:#F4F7FA;border:1px solid #E2E9EF;border-radius:8px;padding:6px 11px">
        <span style="width:7px;height:7px;border-radius:50%;background:#2FA36B;animation:pulsedot 2.4s ease-in-out infinite"></span>AI receptionist live
      </div>
      <div onClick="{{ openAlerts }}" style="position:relative;width:34px;height:34px;border:1px solid #E2E9EF;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff" style-hover="border-color:#087BB2">
        <span style="font-size:14px">🔔</span>
        <span style="position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;border-radius:9px;background:#C8442E;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px">3</span>
      </div>
    </header>
    <div style="flex:1;min-width:0">{{ screen }}</div>
  </main>

  {{ modal }}
  {{ palette }}
  <div style="position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:9px;align-items:flex-end">{{ toastList }}</div>
  <input type="file" ref="{{ fileRef }}" onChange="{{ onFilePicked }}" style="display:none">
</div>

</x-dc>

  };
  componentDidMount(){
    APP = this;
    this._key = e => {
      if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); this.setState(s=>({palette:!s.palette})); }

    document.addEventListener('keydown', this._key);
  }
  componentWillUnmount(){ document.removeEventListener('keydown', this._key); }

  go(id, p){
    const act = OWNER[id] || id;
    const open = {...this.state.open};
    for(const n of NAV){
      if(n.k==='grp'||n.k==='lock'){ if((n.items||[]).some(i=>Array.isArray(i)&&i[0]===act)) open[n.id]=1; }
      if(n.k==='sec') for(const s of n.subs) if(s.items.some(i=>i[0]===act)){ open[n.id]=1; open[s.id]=1; }
    }
    this.setState({cur:id, param:p===undefined?null:p, tab:0, open, palette:false});
    window.scrollTo({top:0, behavior:'smooth'});
  }
  toast(msg, kind){
    const id = Date.now()+Math.random();
    this.setState(s=>({toasts:[...s.toasts, {id, msg, kind:kind||'ok'}]}));
    setTimeout(()=>this.setState(s=>({toasts:s.toasts.filter(t=>t.id!==id)})), 3400);
  }
  openModal(title, body, foot){ this.setState({modal:{title, body, foot}}); }

    this.toast(id+' → '+stage);
  }
  pickFile(after){ this._after = after; this.fileEl && this.fileEl.click(); }
  onFile(e){
    const f = e.target.files && e.target.files[0];
    e.target.value='';
    if(!f) return;
    const cb = this._after || 'estimate';
    const kb = f.size>1048576 ? (f.size/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(f.size/1024))+' KB';
    if(cb==='photos') this.runFlow('Uploading photos — '+f.name+' · '+kb,
      [['Uploading the file',700],['Reading capture metadata — timestamp, device orientation, GPS',700],

      [Btn('Close',{onClick:()=>closeM()}), Btn('Open the photo set',{kind:'pri', onClick:()=>{closeM(); go('photos');}})]);
    else this.runFlow('Upload Xactimate PDF — '+f.name+' · '+kb,
      [['Uploading the file',700],['Reading pages',900],['Detecting the estimate header — number, date, claim, insured, property',800],
       ['Extracting line items',1100],['Scoring confidence per line',700],['Matching descriptions against the mapping dictionary',800],

        Tbl(['Result','Value'], [['Pages read','11'],['Line items found','42'],['Auto-mapped from the dictionary','31 of 42'],

          ['PDF grand total','$62,300.00'],['Reconciliation','<b style="color:#C8442E">Δ $181.60 — does not reconcile</b>']])),
      [Btn('Discard',{onClick:()=>closeM()}), Btn('Open the review screen',{kind:'pri', onClick:()=>{closeM(); go('estimate');}})]);
  }
  runFlow(title, steps, doneBody, doneFoot){
    let i = 0;
    const draw = () => {
      const pct = Math.round(i/steps.length*100);
      this.openModal(title, Stack(
        h('div',{style:{height:'8px', borderRadius:'99px', background:'#EDF3F7', overflow:'hidden'}},
          h('div',{style:{height:'100%', width:pct+'%', background:'linear-gradient(90deg,'+C.pri+','+C.cy+')', transition:'width .5s ease'}})),
        h('div',{style:{fontSize:'12px', color:C.mut}}, pct+'% — step '+Math.min(i+1,steps.length)+' of '+steps.length),
        Tbl(['','Stage','Status'], steps.map((s,n)=>[
          n<i?'✓':(n===i?'▶':'·'), s[0], n<i?'done':(n===i?'<b>running…</b>':'queued')]))),
        [Btn('Working…',{disabled:true})]);
    };
    draw();
    const tick = () => {
      if(i>=steps.length){ this.openModal(title, doneBody, doneFoot); return; }
      const wait = steps[i][1]; i++; draw(); setTimeout(tick, wait);
    };
    setTimeout(tick, 500);

function Palette(props){
  const [q, setQ] = React.useState('');
  const items = [];
  Object.keys(TITLES).forEach(k => items.push({t:TITLES[k], s:'Screen', go:()=>go(k)}));
  props.leads.forEach(l => items.push({t:l.client+' · '+l.id, s:'Lead · '+l.arm, go:()=>go('lead', l.id)}));
  B1.contacts(props.leads).forEach(c => items.push({t:c.n, s:'Contact', go:()=>go('contact', c.n)}));
  const f = q ? items.filter(i => (i.t+i.s).toLowerCase().includes(q.toLowerCase())).slice(0,9) : items.slice(0,8);
  return h('div',{style:{width:'100%', maxWidth:'620px', background:'#fff', borderRadius:'14px', overflow:'hidden',
    boxShadow:'0 24px 60px rgba(14,42,59,.3)', animation:'pop .2s ease both'}},

    h('div',{style:{padding:'9px 18px', fontSize:'11px', color:C.faint, background:'#FAFCFD', borderTop:'1px solid '+C.line}},
      '⌘K to toggle · Esc to close'));
}

/* ================= BLOCK 3 — a working Phase 2 =================
   Every lead that reaches Estimating has an estimating job. The eleven steps keep their state in memory:
   the estimate is read (simulated), corrected and reconciled; the lines are mapped, packaged and budgeted;
   the proposal is assembled, sent, signed and paid — and the lead ends up Won on the Hotlist.
   Nothing leaves the browser: the upload, the client opening the proposal, the signature and the payment are simulated. */
const B3 = (() => {
 const DAY = 86400000, HOUR = 3600000;
 const r2 = n => Math.round(n * 100) / 100;
 const M = n => '$' + Number(n || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
 const num = s => parseFloat(String(s == null ? '' : s).replace(/[$,%\s]/g, '')) || 0;
 const sum = a => a.reduce((x, y) => x + y, 0);
 const hash = s => { let x = 7; for(let i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) % 100003; return x; };
 const dec = s => String(s).replace(/&amp;/g, '&');
 const ME = 'Joshua Tohey';

 /* ---- the estimate that the simulated upload "reads": the 22 lines already in the model plus 20 more, 42 in all.
         Category and room totals equal the two recaps at the back of the final draft. ---- */
